[build-system] # Require setuptool version due to https://github.com/pypa/setuptools/issues/2938
requires = [
    "scikit-build-core[pyproject]>=0.11.0", # Ensuring license field is correctly parsed]
    "nanobind>=1.3.2",
    "setuptools>=77.0.3",                   # Ensuring license field is correctly parsed]
    "packaging>=24.2",                      # Ensuring license field is correctly parsed]
    "pkgconfig",
]

[project]
name = "simcardemsx"
version = "0.1.0"
description = "Next generation cardiac electro-mechanics solver based on FEniCSx"
authors = [{name = "Henrik Finsberg", email = "henriknf@simula.no"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
    "fenics-dolfinx",
    "fenicsx-pulse",
    "fenicsx-beat",
    # crossbridge backs the Ca_i-split activation backend and is imported at
    # package import time via simcardemsx.backends
    "crossbridge",
    # scipy is used by simcardemsx.zero_d for the monolithic reference solve
    "scipy",
    "gotranx>=1.8",
    "toml",
    "pydantic",
    "pydantic_pint",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "cardiac-geometriesx",
]
dev = [
    "pdbpp",
    "ipython",
    "bump2version",
    "mypy",
    "pre-commit",
]
demo = [
    "matplotlib",
    "cardiac-geometriesx",
    "fenicsx-ldrb",
    "circulation",
    "gotranx",
    "io4dolfinx",
]
docs = [
   "jupyter-book",
   "jupytext",
   "jupyter",
   "pyvista[all]>=0.43.0",
   "trame-vuetify",
   "ipywidgets",
   "simcardemsx[demo]",
]
benchmark = [
    "pytest-codspeed",
    "simcardemsx[test]",
]

all = [
    "simcardemsx[test]",
    "simcardemsx[docs]",
    "simcardemsx[dev]",
    "simcardemsx[demo]",
]

[dependency-groups]
# Keep in sync with [build-system].requires above. Needed as a group, not just
# as build-system metadata, because scifem is installed with
# `--no-build-isolation`, so the build backend has to already be present.
build = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=1.3.2",
    "setuptools>=77.0.3",
    "packaging>=24.2",
    "pkgconfig",
]

[tool.pytest.ini_options]
addopts = [
   "--cov=simcardemsx",
   "--cov-report=html",
   "--cov-report=xml",
   "--cov-report=term-missing",
   "-v",
]
testpaths = [
    "tests"
]
markers = ["slow: takes more than a few seconds"]


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "demo/*.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "demos",
]

# Same as Black.
line-length = 100

# Allow unused variables when underscore-prefixed.

# Assume Python 3.10.
target-version = "py310"


[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "I"]
ignore = ["E402", "E741", "E743", "E731"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.ruff.lint.isort]
known-first-party = ["cardiac_geometries"]
known-third-party = [
    "basix",
    "dolfinx",
    "ffcx",
    "ufl",
    "gmsh",
    "numpy",
    "pytest",
]
section-order = [
    "future",
    "standard-library",
    "mpi",
    "third-party",
    "first-party",
    "local-folder",
]
[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py", "petsc4py"]


[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "0.2.0"


[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'


[[tool.bumpversion.files]]
filename = "README.md"
search = "ghcr.io/finsberg/fenicsx-pulse:v{current_version}"
replace = "ghcr.io/finsberg/fenicsx-pulse:v{new_version}"
